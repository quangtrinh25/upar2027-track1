[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "upar2027-track1"
version = "0.1.0"
description = "UPAR Challenge 2027 Track 1 (pedestrian attribute recognition): dg_v1 training, selection and packaging"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "Pillow>=10", "tqdm>=4.66"]

[project.optional-dependencies]
train = ["torch>=2.7", "torchvision>=0.22", "timm==1.0.22", "safetensors"]
test = ["pytest>=8", "scipy>=1.11"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
